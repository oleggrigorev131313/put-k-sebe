name: Validate application code

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check backend Python syntax
        run: |
          python -m py_compile backend/index.py
          python -m py_compile backend/migrate.py
          python -m py_compile backend/test_telegram_start.py
      - name: Simulate Telegram /start welcome
        run: python backend/test_telegram_start.py
      - name: Check deployment script syntax
        run: bash -n backend/deploy.sh
      - name: Check frontend JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html_files = [Path("index.html"), Path("admin.html")]
          scripts = []
          for html_path in html_files:
              html = html_path.read_text(encoding="utf-8")
              found = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, re.I)
              if not found:
                  raise SystemExit(f"No inline script found in {html_path}")
              scripts.extend(found)
          Path("/tmp/put-k-sebe-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/put-k-sebe-inline.js
      - name: Simulate daily summary notifications
        run: |
          python -m py_compile backend/test_daily_summary_notify.py
          python backend/test_daily_summary_notify.py
