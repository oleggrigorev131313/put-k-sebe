<body>
<div class="shell">
<header><button class="back-control" id="app-back" aria-label="Назад" hidden>‹</button><div class="brand"><span class="mark">✳</span><span>Путь <b>к себе</b></span></div><button class="icon" id="settings" aria-label="Настройки">О</button></header>

</div>

<script>
(function(){
"use strict";
var KEY="put-k-sebe-v1",API_BASE="https://d5dhdhkofvnr2t1fnkag.7qsg961h.apigw.yandexcloud.net",CLOUD_SYNC_ENABLED=true,app=document.getElementById("app"),nav=[].slice.call(document.querySelectorAll(".nav button"));
var tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor("#fbfbfd");tg.setBackgroundColor("#fbfbfd");}catch(e){}}
var first=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.first_name;
document.getElementById("settings").textContent=(first||"О").charAt(0).toUpperCase();
var defaults={entries:[],patterns:[],completed:[],practiceHistory:[],personalPractices:[],onboarding:null,chat:[]};
var state=load(),page=state.onboarding?"home":"privacy",step=6,draft=blank(),onboardingDraft=state.onboarding?Object.assign(emptyOnboarding(),state.onboarding):emptyOnboarding(),consentSettings={ai_processing:false,ai_history_storage:false},consentLoaded=false;
var pageHistory=[],progressPeriod="day",cloudReady=false,cloudSyncTimer=null,cloudErrorShown=false,cloudStatus="paused",cloudErrorText="",premiumStatus={active:false,trial_used:false},premiumLoading=false,aiUsage={limit:5,used:0,remaining:5,loading:true};
function load(){try{var x=JSON.parse(localStorage.getItem(KEY));if(!x||!Array.isArray(x.entries))return JSON.parse(JSON.stringify(defaults));var out=Object.assign({},defaults,x);out.patterns=(out.patterns||[]).filter(function(p){return ["p1","p2","p3","p4"].indexOf(p.id)<0;});out.practiceHistory=Array.isArray(out.practiceHistory)?out.practiceHistory:[];out.personalPractices=Array.isArray(out.personalPractices)?out.personalPractices:[];out.chat=Array.isArray(out.chat)?out.chat:[];return out;}catch(e){return JSON.parse(JSON.stringify(defaults));}}
function saveLocalOnly(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){toast("Не удалось сохранить данные на устройстве.");}}
function save(){saveLocalOnly();scheduleCloudSave();}
function apiHeaders(){return {"Content-Type":"application/json","X-Telegram-Init-Data":tg&&tg.initData?tg.initData:""};}
async function refreshPremium(){
 if(!API_BASE||!tg||!tg.initData)return;
 premiumLoading=true;
 try{
 var r=await fetch(API_BASE+"/v1/premium",{method:"GET",headers:apiHeaders(),cache:"no-store"});
 if(!r.ok)throw new Error("premium status unavailable");
 premiumStatus=await r.json();
 }catch(e){premiumStatus={active:false,trial_used:false,error:true};}
 finally{premiumLoading=false;if(page==="home")render();}
}
async function refreshAiUsage(){
 if(!tg||!tg.initData||!API_BASE)return;
 try{var tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"UTC";
 var usageHeaders=apiHeaders();usageHeaders["X-User-Timezone"]=tz;
 var r=await fetch(API_BASE+"/v1/ai/usage",{method:"GET",headers:usageHeaders,cache:"no-store"});
 if(r.ok){aiUsage=await r.json();if(page==="home")render();}}catch(e){}
}
function formatAnalysis(raw){
 var safe=esc(String(raw||""));
 safe=safe.replace(/^#{1,3}\s+(.+)$/gm,"<h3>$1</h3>");
 safe=safe.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
 safe=safe.replace(/^[-•]\s+(.+)$/gm,"<li>$1</li>");
 safe=safe.replace(/(?:<li>[\s\S]*?<\/li>\s*)+/g,function(m){return "<ul>"+m+"</ul>";});
 return safe.split(/\n{2,}/).map(function(p){p=p.trim();return !p?"":(/^<(h3|ul)>/.test(p)?p:"<p>"+p.replace(/\n/g,"<br>")+"</p>");}).join("");
}
function renderAnalysis(raw,entryId){
 var text=String(raw||""),match=text.match(/\*{0,2}Гипотеза паттерна:\*{0,2}\s*\*{0,2}([^|\n*]+)\*{0,2}\s*\|\s*\*{0,2}([^\n*]+)\*{0,2}/i);
 var clean=text.replace(/\n?\*{0,2}Гипотеза паттерна:\*{0,2}[^\n]*/i,"").trim();
 var candidate=match&&match[1].trim().toLowerCase()!=="нет достаточных данных";
 var suggestion=candidate?'<div class="card ai-suggestion" style="margin-top:14px"><div class="eyebrow">Возможное убеждение о себе · гипотеза</div><h3>'+esc(match[1].trim())+'</h3><p>'+esc(match[2].trim())+'</p><button class="btn secondary full" id="accept-ai-pattern">＋ Добавить в мои паттерны</button><p class="sub" style="margin:8px 0 0">Это предварительная формулировка мысли, которую можно проверить и при необходимости переписать.</p></div>':'<p class="sub" style="margin-top:12px">По этой записи пока недостаточно данных, чтобы предложить паттерн.</p>';
 var micro=text.match(/Микро-практика:\s*([^|\n]+)\s*\|\s*([^|\n]+)(?:\s*\|\s*([^\n]+))?/i);var microCard=micro?'<div class="card ai-suggestion" style="margin-top:12px"><div class="eyebrow">Небольшой шаг · рекомендация</div><h3>'+esc(micro[1].trim())+'</h3><p>'+esc(micro[2].trim())+'</p><small>'+esc((micro[3]||"5–10 минут").trim())+'</small><button class="btn secondary full" style="margin-top:10px" data-add-micro="'+esc(entryId)+'">＋ Добавить в мои практики</button></div>':"";clean=clean.replace(/\n?Микро-практика:[^\n]*/i,"");return '<div class="eyebrow">Разбор персонального аналитика</div><div class="analysis-text">'+formatAnalysis(clean)+'</div>'+suggestion+microCard;
}
function linkEntryToPattern(entryId,patternId){
 var entry=state.entries.find(function(x){return String(x.id)===String(entryId);});
 if(!entry||!patternId)return;
 entry.pattern=patternId;
 entry.patterns=Array.isArray(entry.patterns)?entry.patterns:[];
 if(entry.patterns.indexOf(patternId)<0)entry.patterns.push(patternId);
}
function addSuggestedPattern(name,detail,entryId){
 if(!name)return;
 var existing=state.patterns.find(function(p){return String(p.name||"").toLowerCase()===name.toLowerCase()&&p.status!=="rejected";});
 if(existing){
  linkEntryToPattern(entryId,existing.id);existing.entryId=String(entryId);save();
  toast("Запись привязана к существующему паттерну.");closeModal();go("patterns");return;
 }
 var id="p"+Date.now();
 state.patterns.push({id:id,name:name,detail:detail||"",status:"suggested",source:"ai",createdAt:new Date().toISOString(),entryId:String(entryId)});trackEvent("pattern_created",{source:"ai"});
 linkEntryToPattern(entryId,id);
 save();toast("Гипотеза добавлена, а запись привязана к ней.");closeModal();go("patterns");
}
async function analyzeEntry(id,buttonEl){
 if(!tg||!tg.initData){toast("Открой приложение через Telegram.");return;}
 if(!premiumStatus.active){toast("Персональный анализ доступен только в Premium. Активируй пробный период или выбери тариф.");go("subscription");return;}
 var result=document.getElementById("ai-result");
 if(buttonEl){buttonEl.disabled=true;buttonEl.innerHTML='<span class="analysis-spinner" style="display:inline-block;vertical-align:middle;margin-right:8px"></span>Аналитик изучает запись<span class="analysis-dots"></span>';}
 if(result){result.style.display="block";result.innerHTML='<div class="analysis-loading"><span class="analysis-spinner"></span><span>Аналитик изучает запись<span class="analysis-dots"></span><small style="display:block;font-weight:500;margin-top:3px">Сопоставляем ситуацию, мысли и возможные паттерны</small></span></div>';}
 try{
  var response=await fetch(API_BASE+"/v1/ai/analyze-entry",{method:"POST",headers:apiHeaders(),body:JSON.stringify({entry_id:String(id),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||"UTC"})});
  var data=await response.json();
  if(!response.ok){
   if(response.status===403){premiumStatus={active:false};throw new Error("Для анализа нужен активный Premium.");}
   if(response.status===422)throw new Error(data.message||"Не удалось разобрать запись. Проверь, достаточно ли в ней понятного текста.");
    if(response.status===429)throw new Error(data.message||"Дневной лимит анализов исчерпан.");
   var diagnostic=data.detail||data.provider_code||data.error||"Неизвестная ошибка";
   if(data.provider_status)diagnostic+=" (HTTP "+data.provider_status+")";
   throw new Error("Ошибка аналитика: "+diagnostic);
  }
  var entry=state.entries.find(function(x){return String(x.id)===String(id);});
  if(entry&&consentSettings.ai_history_storage){entry.analysis=data.analysis||"";save();}
   trackEvent("ai_analysis_created",{entry_id:String(id),cached:!!data.cached});
