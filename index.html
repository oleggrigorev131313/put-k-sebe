<style>

button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:680px;min-height:100vh;margin:auto;padding:env(safe-area-inset-top) 18px calc(92px + env(safe-area-inset-bottom))}
header{height:62px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px;font-weight:700}.mark{width:31px;height:31px;border-radius:11px;background:linear-gradient(145deg,#fff,#e7eaff);display:grid;place-items:center;color:var(--blue);font-size:21px;box-shadow:var(--shadow)}

.hero{padding:24px;background:linear-gradient(135deg,rgba(255,255,255,.97),rgba(240,242,255,.9));position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:170px;height:170px;right:-70px;top:-75px;border-radius:50%;background:radial-gradient(circle,#dfe4ff,transparent 70%);pointer-events:none}.hero h1{font-size:30px;line-height:1.12;letter-spacing:-1.3px;margin:9px 0}.hero p{font-size:13px;color:#747a90;line-height:1.6;max-width:450px;margin:8px 0 18px}
.btn{border:0;border-radius:15px;padding:13px 17px;font-size:13px;font-weight:800;transition:transform .15s}.btn:active{transform:scale(.98)}.primary{background:#282a38;color:#fff;box-shadow:0 8px 20px #282a3822}.secondary{background:#eef0ff;color:#5966c2}.outline{background:#fff;border:1px solid var(--line);color:#5f6682}.full{width:100%}
.section{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 11px}.section h2{font-size:16px;margin:0}.textbtn{border:0;background:none;color:var(--blue);font-size:12px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick{min-height:112px;border:1px solid var(--line);border-radius:19px;background:rgba(255,255,255,.82);padding:15px;text-align:left;box-shadow:var(--shadow);color:var(--ink)}.qi{width:34px;height:34px;border-radius:12px;background:var(--lav);display:grid;place-items:center;color:var(--blue);font-size:18px;margin-bottom:11px}.quick b{font-size:13px;display:block}.quick small{display:block;color:var(--muted);font-size:11px;line-height:1.4;margin-top:4px}
.statrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat strong{font-size:31px;letter-spacing:-1.2px;display:block}.stat span{font-size:11px;color:var(--muted)}
.field{margin:15px 0}.field label{font-size:12px;font-weight:800;display:block;margin-bottom:7px}.input,.area,.select{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px;color:var(--ink);font-size:16px;caret-color:#111;outline:none;-webkit-text-size-adjust:100%}.area{min-height:86px;resize:vertical;line-height:1.5}.input:focus,.area:focus,.select:focus{border-color:#aab1f0;box-shadow:0 0 0 3px #e9ebff}
.range{display:flex;align-items:center;gap:12px}.range input{flex:1;accent-color:var(--blue)}.range strong{width:40px;text-align:center;color:#6873cd}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid var(--line);background:#fff;border-radius:30px;padding:8px 11px;color:#757b91;font-size:11px;font-weight:700}.chip.active{background:#eff0ff;color:#5966c2;border-color:#ccd1ff}
.entry{margin:10px 0}.entry h3{font-size:14px;margin:9px 0 5px}.entry p{font-size:12px;line-height:1.5;color:#73798d;margin:4px 0}.meta{display:flex;justify-content:space-between;font-size:10px;color:#9599a9}
.pattern{display:flex;gap:12px;margin:10px 0;align-items:flex-start}.picon{width:38px;height:38px;flex:none;border-radius:13px;background:#f0f1ff;color:var(--blue);display:grid;place-items:center}.pattern b{font-size:13px}.pattern p{font-size:11px;color:var(--muted);margin:4px 0;line-height:1.45}
.chart{width:100%;height:170px}.chart svg{width:100%;height:100%}.empty{text-align:center;padding:27px 18px}.empty .symbol{font-size:32px;margin-bottom:8px}.empty h3{font-size:15px;margin:0 0 7px}.empty p{font-size:12px;line-height:1.5;color:var(--muted);max-width:300px;margin:0 auto 15px}
.analysis-text{font-size:12px;line-height:1.7;color:#646b80}.analysis-loading{display:flex;align-items:center;gap:10px;padding:13px 15px;margin:10px 0;background:#f5f6ff;border:1px solid #e6e8fb;border-radius:14px;color:#626b9c;font-size:12px;font-weight:700}.analysis-spinner{width:17px;height:17px;border:2px solid #d9dcf5;border-top-color:#6875d3;border-radius:50%;animation:analysis-spin .8s linear infinite;flex:none}.analysis-dots:after{content:"";display:inline-block;width:1.4em;text-align:left;animation:analysis-dots 1.4s steps(4,end) infinite}@keyframes analysis-spin{to{transform:rotate(360deg)}}@keyframes analysis-dots{0%{content:""}25%{content:"."}50%{content:".."}75%,100%{content:"..."} }.analysis-text p{margin:0 0 12px}.analysis-text strong{font-weight:800;color:#292b38}.analysis-text h3{font-size:13px;color:#292b38;margin:15px 0 6px}.analysis-text ul{padding-left:18px;margin:5px 0 12px}.analysis-text li{margin:4px 0}.ai-suggestion{background:#f8f8ff}.ai-suggestion h3{font-size:14px;margin:7px 0}.note{background:#f7f7fb;border:1px solid var(--line);border-radius:14px;padding:12px;color:#777d90;font-size:10px;line-height:1.5;margin-top:16px}.nav{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,680px);display:grid;grid-template-columns:repeat(5,1fr);padding:9px 7px calc(9px + env(safe-area-inset-bottom));background:rgba(255,255,255,.91);backdrop-filter:blur(18px);border-top:1px solid #ececf3}.nav button{border:0;background:none;color:#9a9eae;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 0}.nav button.active{color:#5966c8}.nav i{font-style:normal;font-size:21px;line-height:24px}
.modalbg{position:fixed;z-index:30;inset:0;background:#22233355;display:grid;align-items:end;padding:12px}.modal{background:white;border-radius:24px;padding:21px;max-height:85vh;overflow:auto;width:min(100%,620px);margin:auto}.modal h2{font-size:19px;margin:0 0 8px}.modal p{font-size:12px;line-height:1.55;color:var(--muted)}.modalhead{display:flex;justify-content:flex-end;margin-bottom:6px}.toast{position:fixed;z-index:50;bottom:95px;left:50%;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#282a38;color:white;padding:11px 16px;border-radius:30px;font-size:12px;transition:.2s;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
.billing-teaser{display:flex;align-items:center;justify-content:space-between;gap:14px;background:linear-gradient(135deg,#fff,#f3f4ff)}.billing-teaser .billtag{font-size:10px;color:#6873cd;background:#eff0ff;border-radius:20px;padding:6px 9px;font-weight:800}.plan-card{position:relative;overflow:hidden}.plan-card.featured{border-color:#cfd3ff;background:linear-gradient(145deg,#fff,#f4f5ff)}.plan-price{font-size:30px;font-weight:800;letter-spacing:-1px}.plan-list{margin:12px 0 0;padding:0;list-style:none}.plan-list li{font-size:12px;color:#60667c;padding:7px 0;border-bottom:1px solid #f0f0f5}.plan-list li:last-child{border:0}.plan-list li:before{content:'✓';color:#7180db;font-weight:800;margin-right:9px}.billing-route{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px;background:#fff}.billing-route b{display:block;font-size:13px;margin-bottom:5px}.billing-route p{font-size:11px;color:var(--muted);line-height:1.5;margin:0}.status-pill{display:inline-flex;align-items:center;border-radius:30px;background:#f2f3f8;padding:6px 10px;font-size:10px;font-weight:800;color:#767d91}.status-pill.green{background:#eaf7f0;color:#398964}.price-note{font-size:11px;line-height:1.55;color:#777e92;background:#f7f8fc;border:1px solid var(--line);padding:12px;border-radius:14px;margin-top:14px}
@media(min-width:600px){.shell{padding-left:28px;padding-right:28px}.hero{padding:29px}.title{font-size:31px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="shell">
<header><div class="brand"><span class="mark">✳</span><span>Путь <b>к себе</b></span></div><button class="icon" id="settings" aria-label="Настройки">О</button></header>
<main id="app" aria-live="polite"></main>
</div>

<button data-page="home" class="active"><i>⌂</i>Главная</button>

<div class="toast" id="toast" role="status"></div>
<script>
(function(){
"use strict";
var KEY="put-k-sebe-v1",API_BASE="https://d5dhdhkofvnr2t1fnkag.7qsg961h.apigw.yandexcloud.net",CLOUD_SYNC_ENABLED=true,app=document.getElementById("app"),nav=[].slice.call(document.querySelectorAll(".nav button"));
var tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor("#fbfbfd");tg.setBackgroundColor("#fbfbfd");}catch(e){}}
var first=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.first_name;
document.getElementById("settings").textContent=(first||"О").charAt(0).toUpperCase();
var defaults={entries:[],patterns:[],completed:[],practiceHistory:[],onboarding:null,chat:[]};
var state=load(),page=state.onboarding?"home":"onboarding",step=6,draft=blank(),onboardingDraft=state.onboarding?Object.assign(emptyOnboarding(),state.onboarding):emptyOnboarding();
var cloudReady=false,cloudSyncTimer=null,cloudErrorShown=false,cloudStatus="paused",cloudErrorText="",premiumStatus={active:false,trial_used:false},premiumLoading=false,aiUsage={limit:5,used:0,remaining:5,loading:true};
function load(){try{var x=JSON.parse(localStorage.getItem(KEY));if(!x||!Array.isArray(x.entries))return JSON.parse(JSON.stringify(defaults));var out=Object.assign({},defaults,x);out.patterns=(out.patterns||[]).filter(function(p){return ["p1","p2","p3","p4"].indexOf(p.id)<0;});out.practiceHistory=Array.isArray(out.practiceHistory)?out.practiceHistory:[];out.chat=Array.isArray(out.chat)?out.chat:[];return out;}catch(e){return JSON.parse(JSON.stringify(defaults));}}
function saveLocalOnly(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){toast("Не удалось сохранить данные на устройстве.");}}
function save(){saveLocalOnly();scheduleCloudSave();}
function apiHeaders(){return {"Content-Type":"application/json","X-Telegram-Init-Data":tg&&tg.initData?tg.initData:""};}
async function refreshPremium(){
 if(!API_BASE||!tg||!tg.initData)return;
 premiumLoading=true;
 try{
 var r=await fetch(API_BASE+"/v1/premium",{method:"GET",headers:apiHeaders(),cache:"no-store"});
 if(!r.ok)throw new Error("premium status unavailable");
 premiumStatus=await r.json();
 }catch(e){premiumStatus={active:false,trial_used:false,error:true};}
 finally{premiumLoading=false;}
}
async function refreshAiUsage(){
 if(!tg||!tg.initData||!API_BASE)return;
 try{var tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"UTC";
 var r=await fetch(API_BASE+"/v1/ai/usage?timezone="+encodeURIComponent(tz),{method:"GET",headers:apiHeaders(),cache:"no-store"});
 if(r.ok){aiUsage=await r.json();if(page==="home")render();}}catch(e){}
}
function formatAnalysis(raw){
 var safe=esc(String(raw||""));
 safe=safe.replace(/^#{1,3}\s+(.+)$/gm,"<h3>$1</h3>").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
 safe=safe.replace(/^[-•]\s+(.+)$/gm,"<li>$1</li>");
 safe=safe.replace(/(?:<li>[\s\S]*?<\/li>\s*)+/g,function(m){return "<ul>"+m+"</ul>";});
 return safe.split(/\n{2,}/).map(function(p){p=p.trim();return !p?"":(/^<(h3|ul)>/.test(p)?p:"<p>"+p.replace(/\n/g,"<br>")+"</p>");}).join("");
}
function renderAnalysis(raw,entryId){
 var text=String(raw||""),match=text.match(/\*{0,2}Гипотеза паттерна:\*{0,2}\s*\*{0,2}([^|\n*]+)\*{0,2}\s*\|\s*\*{0,2}([^\n*]+)\*{0,2}/i);
 var clean=text.replace(/\n?\*{0,2}Гипотеза паттерна:\*{0,2}[^\n]*/i,"").trim();
 var candidate=match&&match[1].trim().toLowerCase()!=="нет достаточных данных";
 var suggestion=candidate?'<div class="card ai-suggestion" style="margin-top:14px"><div class="eyebrow">Возможное убеждение о себе · гипотеза</div><h3>'+esc(match[1].trim())+'</h3><p>'+esc(match[2].trim())+'</p><button class="btn secondary full" id="accept-ai-pattern">＋ Добавить в мои паттерны</button><p class="sub" style="margin:8px 0 0">Это предварительная формулировка мысли, которую можно проверить и при необходимости переписать.</p></div>':'<p class="sub" style="margin-top:12px">По этой записи пока недостаточно данных, чтобы предложить паттерн.</p>';
 return '<div class="eyebrow">Разбор персонального аналитика</div><div class="analysis-text">'+formatAnalysis(clean)+'</div>'+suggestion;
}
function linkEntryToPattern(entryId,patternId){
 var entry=state.entries.find(function(x){return String(x.id)===String(entryId);});
 if(!entry||!patternId)return;
 entry.pattern=patternId;
 entry.patterns=Array.isArray(entry.patterns)?entry.patterns:[];
 if(entry.patterns.indexOf(patternId)<0)entry.patterns.push(patternId);
}
function addSuggestedPattern(name,detail,entryId){
 if(!name)return;
 var existing=state.patterns.find(function(p){return String(p.name||"").toLowerCase()===name.toLowerCase()&&p.status!=="rejected";});
 if(existing){
  linkEntryToPattern(entryId,existing.id);existing.entryId=String(entryId);save();
  toast("Запись привязана к существующему паттерну.");closeModal();go("patterns");return;
 }
 var id="p"+Date.now();
 state.patterns.push({id:id,name:name,detail:detail||"",status:"suggested",source:"ai",createdAt:new Date().toISOString(),entryId:String(entryId)});
 linkEntryToPattern(entryId,id);
 save();toast("Гипотеза добавлена, а запись привязана к ней.");closeModal();go("patterns");
}
async function analyzeEntry(id,buttonEl){
 if(!tg||!tg.initData){toast("Открой приложение через Telegram.");return;}
 var result=document.getElementById("ai-result");
 if(buttonEl){buttonEl.disabled=true;buttonEl.innerHTML='<span class="analysis-spinner" style="display:inline-block;vertical-align:middle;margin-right:8px"></span>Аналитик изучает запись<span class="analysis-dots"></span>';}
 if(result){result.style.display="block";result.innerHTML='<div class="analysis-loading"><span class="analysis-spinner"></span><span>Аналитик изучает запись<span class="analysis-dots"></span><small style="display:block;font-weight:500;margin-top:3px">Сопоставляем ситуацию, мысли и возможные паттерны</small></span></div>';}
 try{
  var response=await fetch(API_BASE+"/v1/ai/analyze-entry",{method:"POST",headers:apiHeaders(),body:JSON.stringify({entry_id:String(id),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||"UTC"})});
  var data=await response.json();
  if(!response.ok){
   if(response.status===403)throw new Error("Для анализа нужен активный Premium.");
    if(response.status===429)throw new Error(data.message||"Дневной лимит анализов исчерпан.");
   var diagnostic=data.detail||data.provider_code||data.error||"Неизвестная ошибка";
   if(data.provider_status)diagnostic+=" (HTTP "+data.provider_status+")";
   throw new Error("Ошибка аналитика: "+diagnostic);
  }
  var entry=state.entries.find(function(x){return String(x.id)===String(id);});
  if(entry){entry.analysis=data.analysis||"";save();}
  if(result){result.style.display="block";result.innerHTML=renderAnalysis(data.analysis||"Анализ не получен.",id);}
  var accept=document.getElementById("accept-ai-pattern");
  if(accept){var mm=String(data.analysis||"").match(/\*{0,2}Гипотеза паттерна:\*{0,2}\s*\*{0,2}([^|\n*]+)\*{0,2}\s*\|\s*\*{0,2}([^\n*]+)\*{0,2}/i);if(mm)accept.onclick=function(){addSuggestedPattern(mm[1].trim(),mm[2].trim(),id);};}
  if(buttonEl)buttonEl.style.display="none";
  refreshAiUsage();
 }catch(e){
  toast(e.message||"Ошибка анализа.");
  if(buttonEl){buttonEl.disabled=false;buttonEl.textContent="Повторить анализ";}if(result){result.style.display="none";result.innerHTML="";}
 }
}
async function runDailySummary(buttonEl){
 if(!tg||!tg.initData){toast("Открой приложение через Telegram.");return;}
 if(buttonEl){buttonEl.disabled=true;buttonEl.textContent="Собираю сводку…";}
 try{
  var response=await fetch(API_BASE+"/v1/ai/daily-summary",{method:"POST",headers:apiHeaders(),body:JSON.stringify({timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||"UTC"})});
  var data=await response.json();
  if(!response.ok){
   if(response.status===403)throw new Error("Для сводки нужен активный Premium.");
   if(data.error==="no_entries_today")throw new Error("Сегодня пока нет записей для сводки.");
   throw new Error(data.message||data.detail||data.error||"Не удалось подготовить сводку.");
  }
  modal('<div class="eyebrow">Итоги дня</div><h2>Твоя дневная сводка</h2><div class="note" style="white-space:pre-wrap;color:var(--ink);font-size:12px;line-height:1.65">'+esc(data.summary||"Сводка не получена.")+'</div><p>Предложенные паттерны — только гипотезы. Добавляй их в раздел «Паттерны» только если узнаёшь в них повторяющийся сценарий.</p><button class="btn secondary full" id="summary-patterns">Перейти к паттернам</button>');
  document.getElementById("summary-patterns").onclick=function(){closeModal();go("patterns");};
 }catch(e){toast(e.message||"Ошибка подготовки сводки.");}
 finally{if(buttonEl){buttonEl.disabled=false;buttonEl.textContent="✦ Подвести итоги дня";}}
}
function trackEvent(name){
if(!API_BASE||!tg||!tg.initData)return;
fetch(API_BASE+"/v1/events",{method:"POST",headers:apiHeaders(),body:JSON.stringify({event:name})}).catch(function(){});
}
function trackInitialSession(){
try{
if(!sessionStorage.getItem("pks_session_open")){
sessionStorage.setItem("pks_session_open","1");trackEvent("app_open");
}
if(page==="onboarding"&&!sessionStorage.getItem("pks_onboarding_started")){
sessionStorage.setItem("pks_onboarding_started","1");trackEvent("onboarding_started");
}
}catch(e){trackEvent("app_open");}
}
async function cloudSaveNow(showToast){
if(!CLOUD_SYNC_ENABLED||!API_BASE||!tg||!tg.initData||!cloudReady)return;
cloudStatus="syncing";
var snapshot=JSON.stringify(state);
var r=await fetch(API_BASE+"/v1/state",{method:"PUT",headers:apiHeaders(),body:JSON.stringify({state:JSON.parse(snapshot)})});
if(!r.ok){var errBody="";try{var errJson=await r.json();errBody=errJson&&errJson.error?": "+errJson.error:"";}catch(ignore){}throw new Error("HTTP "+r.status+errBody);}
cloudStatus="synced";cloudErrorText="";
if(showToast)toast("Запись синхронизирована с аккаунтом");
}
function scheduleCloudSave(){
if(!CLOUD_SYNC_ENABLED||!cloudReady||!API_BASE)return;
if(cloudSyncTimer)clearTimeout(cloudSyncTimer);
cloudStatus="pending";
cloudSyncTimer=setTimeout(function(){cloudSaveNow(true).catch(function(e){cloudReady=false;cloudStatus="error";cloudErrorText=e&&e.message?e.message:"Ошибка соединения";if(!cloudErrorShown){cloudErrorShown=true;toast("Облако не подтвердило сохранение. Запись пока только на устройстве.");}render();});},650);
}
function mergeStates(remote,local){
var out=Object.assign({},remote||{},local||{});
function mergeById(a,b){
var m={};
(a||[]).concat(b||[]).forEach(function(x){if(x&&typeof x==="object"){var k=x.id||JSON.stringify(x);m[k]=x;}});
return Object.keys(m).map(function(k){return m[k];});
}
out.entries=mergeById(remote&&remote.entries,local&&local.entries).sort(function(a,b){return new Date(b.date||0)-new Date(a.date||0);});
out.patterns=mergeById(remote&&remote.patterns,local&&local.patterns);
