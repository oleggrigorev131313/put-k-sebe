<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f1e9">
<meta name="color-scheme" content="light">
<meta name="description" content="ПЕРЕСМОТР — пространство для осознанного взгляда на себя, свои мысли и жизнь.">
<title>ПЕРЕСМОТР</title>
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/logo-mark.png">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="assets/theme-match.js"></script>
<style>
:root{
  --bg:#f3eee6;
  --bg-2:#e9e2d6;
  --card:#fffcf8;
  --ink:#1b2422;
  --muted:#8a857c;
  --soft:#5f675f;
  --line:#e4ddd2;
  --pine:#31443d;
  --pine-2:#283832;
  --cream:#f6f1e8;
  --sage:#d7e0d4;
  --shadow:0 10px 28px rgba(62,52,36,.06);
  --radius:26px;
  --font:"Onest","Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"Cormorant Garamond","Iowan Old Style",Palatino,Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);font-size:17px;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button,a{-webkit-tap-highlight-color:transparent}
.shell{position:relative;width:min(100%,480px);min-height:100vh;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);background:var(--bg)}
body.has-tabs .shell{padding-bottom:calc(112px + env(safe-area-inset-bottom))}
main{flex:1;display:flex;flex-direction:column;padding:8px 22px 32px}
body[data-page="welcome"] main{padding:0}
.cta{justify-content:space-between;padding-left:18px;padding-right:18px}
.cta-label{display:inline-flex;align-items:center;gap:10px}
.topbar{min-height:58px;display:flex;align-items:center;justify-content:center;position:relative;padding:10px 18px 0}
.topbar[hidden]{display:none}
.topbar.slim{min-height:0;height:0;padding:0;overflow:visible}
.topbar.slim .round{top:4px}
body.has-float-info .page-head{padding-right:56px}
.brand-mini{display:flex;align-items:center;gap:10px;font-weight:500;letter-spacing:.24em;font-size:15px}
.logo-mark{display:block;height:auto}
.brand-mini .logo-mark{width:34px}
.avatar,.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow);position:absolute;right:16px;top:8px;padding:0}
.round.left{left:16px;right:auto}
.round.static{position:static;flex:none}
.avatar svg,.round .ico{width:22px;height:22px}
h1,.h1{font-size:32px;line-height:1.12;letter-spacing:-.7px;font-weight:800;margin:0}
h2{font-size:22px;margin:0;font-weight:800}
.lead{color:var(--soft);font-size:17px;line-height:1.45;margin:10px 0 0}
.page-head{margin:8px 0 16px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 18px}
.btn{border:0;border-radius:999px;min-height:60px;padding:16px 22px;font-size:17px;font-weight:700;background:var(--pine);color:var(--cream);display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;text-align:center;line-height:1.2}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.48;cursor:not-allowed;transform:none}
.btn.full{width:100%}
.btn.soft{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn.light{background:var(--cream);color:var(--pine)}
.btn.outline{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn .ico{width:22px;height:22px}
.textbtn{border:0;background:none;padding:10px 4px;color:var(--ink);font-weight:700;font-size:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.welcome{position:relative;flex:1;display:flex;flex-direction:column;padding:12px 28px calc(18px + env(safe-area-inset-bottom));overflow:hidden}
.welcome-mid{position:relative;z-index:1;text-align:center;padding-top:6vh}
.welcome-logo{width:min(220px,62vw);margin:0 auto}
.wordmark{font-weight:300;font-size:26px;letter-spacing:.42em;margin:22px 0 12px;padding-left:.42em}
.slogan{margin:0;font-size:13px;letter-spacing:.36em;font-weight:400;color:#6f7774;padding-left:.36em}
.welcome-copy{max-width:320px;margin:26px auto 0;color:#5e675f;font-size:18px;line-height:1.45}
.pager{display:flex;gap:8px;justify-content:center;margin:26px 0 0}
.pager i{width:9px;height:9px;border-radius:50%;background:#ddd6cb;display:block}
.pager i.on{background:var(--pine)}
.welcome-actions{position:relative;z-index:1;margin-top:auto;width:100%;display:flex;flex-direction:column;align-items:stretch;gap:14px;padding:28px 6px 4px}
.mountains{position:absolute;left:-6%;right:-6%;bottom:0;height:68%;z-index:0;pointer-events:none}
.mountains svg{width:100%;height:100%;display:block}
.consent{flex:1;display:flex;flex-direction:column;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.consent .h1{font-size:34px;max-width:320px;margin-top:8px}
.info-card{display:flex;gap:14px;align-items:flex-start}
.info-ico{width:52px;height:52px;border-radius:16px;background:#f3f0e8;color:var(--pine);display:grid;place-items:center;flex:none}
.info-ico .ico{width:26px;height:26px}
.info-card b{display:block;font-size:17px;margin-bottom:4px}
.info-card p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.consent-actions{margin-top:auto;padding-top:28px;display:flex;flex-direction:column;align-items:center;gap:12px}
.fine{color:var(--muted);font-size:14px;line-height:1.45;text-align:center;margin:0}
.greet{font-size:34px;letter-spacing:-.8px}
.cta{min-height:64px;font-size:18px;box-shadow:0 12px 24px rgba(49,68,61,.16)}
.section-label{font-size:22px;font-weight:800;margin:26px 2px 14px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{min-height:138px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.stat strong,.stats3 strong{font-size:36px;letter-spacing:-1px;font-weight:800;line-height:1}
.stat span,.stats3 span{color:var(--muted);font-size:14px}
.stat-ico{width:46px;height:46px;border-radius:16px;background:#f1f3ee;color:var(--pine);display:grid;place-items:center}
.stat-ico .ico{width:24px;height:24px}
.link-card{width:100%;display:flex;align-items:center;gap:14px;text-align:left;border:0;margin-top:14px}
.link-card b{display:block;font-size:17px}
.link-card small{display:block;color:var(--muted);font-size:15px;line-height:1.4;margin-top:4px}
.link-card .grow{flex:1;min-width:0}
.chevron{color:#b7b1a6;flex:none;display:grid;place-items:center}
.chevron .ico{width:22px;height:22px}
.chips{display:flex;gap:10px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none;cursor:grab}
.chips::-webkit-scrollbar{display:none}
.chips.is-dragging,.theme-scroll.is-dragging{cursor:grabbing;user-select:none}
.chip{flex:none;border:0;background:var(--card);color:#6f736c;border-radius:999px;padding:12px 18px;font-size:15px;font-weight:700;box-shadow:var(--shadow)}
.chip.active{background:var(--pine);color:var(--cream)}
.entry-card{width:100%;text-align:left;border:0;margin:0 0 12px;display:block}
.entry-top{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:14px;font-weight:700}
.entry-card h3{font-size:19px;line-height:1.3;margin:10px 0 8px;font-weight:800}
.look-label{font-size:14px;color:var(--muted);margin-bottom:4px}
.entry-card p,.look-text{margin:0;color:#5c6560;font-size:16px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;color:var(--muted);padding:22px 12px}
.empty b{display:block;color:var(--ink);margin-bottom:6px}
.step-label{margin:4px 0 0;color:var(--muted);font-size:16px;font-weight:700}
.stepdots{display:flex;align-items:center;margin:16px 2px 22px}
.stepdots i{width:14px;height:14px;border-radius:50%;background:#e4ddd4;flex:none;box-shadow:0 0 0 4px var(--bg)}
.stepdots i.on{background:var(--pine)}
.stepdots b{flex:1;height:3px;background:#e4ddd4;margin:0 2px;border-radius:3px}
.stepdots b.on{background:var(--pine)}
.question{font-size:32px;letter-spacing:-.6px;margin:0;font-weight:800}
.field-card{padding:8px}
.field-card.solo{padding:6px 8px}
.field-card.solo .area{border:0;background:transparent;box-shadow:none;min-height:168px}
.wizard-actions .btn{min-width:168px;min-height:56px;padding:14px 26px}
.field{margin:14px 0}
.field label,.label{display:block;font-size:15px;font-weight:800;margin-bottom:8px}
.input,.area,.select{width:100%;border:1px solid var(--line);background:#fff;border-radius:18px;padding:16px;font-size:17px;outline:none;caret-color:var(--pine)}
.area{min-height:150px;resize:vertical;line-height:1.45}
.input:focus,.area:focus,.select:focus{border-color:#8aa094;box-shadow:0 0 0 3px rgba(49,68,61,.12)}
.area::placeholder,.input::placeholder{color:#b0aaa0}
.hintbox{display:flex;gap:12px;align-items:flex-start;background:#f7f4ee;border-radius:18px;padding:14px 16px;color:#8d887f;font-size:15px;line-height:1.45;margin-top:14px}
.hintbox .ico{width:20px;height:20px;flex:none;margin-top:1px;color:#8d948c}
.wizard-actions{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:18px}
.wizard-actions .textbtn{margin-right:auto}
.range{display:flex;align-items:center;gap:12px}
.range input{flex:1;accent-color:var(--pine)}
.range strong{min-width:48px;text-align:right;color:var(--pine);font-size:14px}
.emotion-groups{display:grid;gap:8px}
.emotion-group{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden}
.emotion-group-head{width:100%;display:flex;justify-content:space-between;gap:8px;padding:12px 14px;border:0;background:transparent;text-align:left;font-weight:700;font-size:13px;color:#5c6560}
.emotion-group-count{min-width:18px;height:18px;border-radius:9px;background:var(--sage);display:inline-grid;place-items:center;font-size:11px;margin-right:6px}
.emotion-group-body{padding:0 12px 12px}
.choice-chips{display:flex;flex-wrap:wrap;gap:8px}
.choice-chips .chip{box-shadow:none;border:1px solid var(--line)}
.custom-emotion{margin-top:12px}
.custom-row{display:flex;gap:8px}
.custom-row .input{min-width:0}
.custom-row .btn{padding:12px 14px;white-space:nowrap}
.seg{display:flex;background:#ebe6dc;border-radius:999px;padding:5px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;min-height:48px;padding:12px 8px;font-size:15px;font-weight:800;color:#7d8178}
.seg button.active{background:var(--pine);color:var(--cream)}
.row{width:100%;display:flex;align-items:center;gap:14px;text-align:left;border:0;margin-top:12px}
.row-ico{width:48px;height:48px;border-radius:16px;background:#f1f3ee;color:var(--pine);display:grid;place-items:center;flex:none}
.row-ico.done{background:#e5f0e6;color:#3e6b4e}
.row-ico .ico{width:24px;height:24px}
.row b{display:block;font-size:17px;line-height:1.3}
.row small{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.row .grow{flex:1;min-width:0}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-items:start;justify-items:stretch;text-align:center;padding:20px 12px;box-sizing:border-box}
.stats3>div{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;height:100%}
.stats3 strong{display:block;line-height:1}
.stats3 span{display:block;width:100%;margin-top:8px;font-size:12px;line-height:1.3}
.chart-card h2{font-size:20px;margin-bottom:10px}
.chart{width:100%;height:230px}
.chart svg{width:100%;height:100%;display:block}
.chart-note{color:var(--muted);font-size:15px;line-height:1.45;margin:10px 0 0}
.premium{position:relative;flex:1;display:flex;flex-direction:column;color:#f4f1ea;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
body[data-page="subscription"]{background:#1b2c2a}
body[data-page="subscription"] .shell{background:radial-gradient(80% 42% at 118% -8%,rgba(244,241,234,.42),transparent 46%),radial-gradient(55% 36% at 100% 8%,rgba(150,176,166,.28),transparent 42%),linear-gradient(165deg,#314844 0%,#1d332f 42%,#152422 100%)}
.premium-glow{position:absolute;right:-120px;top:-140px;width:340px;height:340px;border-radius:50%;border:46px solid rgba(244,241,234,.08);pointer-events:none}
body[data-page="subscription"] .round{background:rgba(255,255,255,.1);border-color:transparent;color:#f4f1ea;box-shadow:none}
.premium h1{font-family:var(--serif);font-weight:600;font-size:58px;letter-spacing:-.02em;margin-top:8px;line-height:.95}
.premium .lead{color:rgba(244,241,234,.82);max-width:320px;font-size:18px}
.check-list{list-style:none;margin:28px 0 0;padding:0;display:flex;flex-direction:column;gap:18px}
.check-list li{display:flex;gap:12px;align-items:flex-start;font-size:18px;line-height:1.35}
.check-bullet{width:28px;height:28px;border-radius:50%;border:1.6px solid rgba(244,241,234,.9);display:grid;place-items:center;flex:none;margin-top:0}
.check-bullet .ico{width:16px;height:16px}
.price-note{color:rgba(244,241,234,.78);font-size:15px;line-height:1.45;margin:14px 0 0}
.premium-screen{min-height:calc(100vh - env(safe-area-inset-top) - 86px);display:flex;flex-direction:column}
.premium-buy{margin-top:auto;padding-top:18px}
.premium-plans{display:flex;flex-direction:column;gap:12px;padding:22px 0 12px}
.plan{display:block;background:rgba(255,255,255,.06);border-radius:18px;padding:14px 16px;color:inherit;text-decoration:none}
.plan b{display:block;font-size:17px}
.plan span{display:block;color:rgba(244,241,234,.72);font-size:14px;margin-top:4px;line-height:1.4}
.tabbar{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,480px);display:none;grid-template-columns:repeat(5,1fr);gap:0;padding:10px 4px calc(10px + env(safe-area-inset-bottom));background:rgba(247,243,236,.94);backdrop-filter:blur(16px);border-top:1px solid rgba(226,220,210,.95)}
body.has-tabs .tabbar{display:grid}
.tabbar button{border:0;background:none;color:#a39e95;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0}
.tabbar button.active{color:var(--pine)}
.tabbar .ico{width:26px;height:26px}
.modalbg{position:fixed;inset:0;z-index:40;background:rgba(28,32,30,.38);display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{background:var(--bg);width:min(100%,480px);max-height:min(88vh,780px);overflow:auto;border-radius:24px 24px 0 0;padding:12px 18px calc(18px + env(safe-area-inset-bottom))}
.modal h2{font-size:26px;letter-spacing:-.4px;margin:0 0 8px}
.modal p{font-size:16px;line-height:1.5;color:var(--soft)}
.modalhead{display:flex;justify-content:flex-end;margin-bottom:4px}
.modalhead .round{position:static}
.toast{position:fixed;z-index:70;left:50%;bottom:calc(108px + env(safe-area-inset-bottom));transform:translate(-50%,10px);opacity:0;pointer-events:none;background:var(--pine);color:var(--cream);padding:14px 18px;border-radius:999px;font-size:15px;max-width:calc(100% - 32px);text-align:center;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.analysis-text{font-size:16px;line-height:1.55;color:var(--ink)}
.analysis-text p{margin:0 0 10px;color:var(--ink)}
.analysis-text h3{font-size:15px;margin:12px 0 6px}
.analysis-text ul{margin:6px 0 10px;padding-left:18px}
.analysis-loading{display:flex;gap:10px;align-items:center;color:var(--pine);font-weight:700;font-size:13px}
.analysis-spinner{width:16px;height:16px;border:2px solid #d5ddd6;border-top-color:var(--pine);border-radius:50%;animation:spin .8s linear infinite;flex:none}
.analysis-dots:after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.4s steps(4,end) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%,100%{content:"..."}}
.note{background:#f6f3ed;border-radius:18px;padding:14px 16px;color:var(--muted);font-size:15px;line-height:1.5}
.ai-suggestion{margin-top:12px}
.pattern-record-row{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:transparent}
.pattern-record-date{font-size:12px;color:var(--muted)}
.muted{color:var(--muted);font-size:15px;line-height:1.45}
.page-head.with-tool{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.status-line{font-size:13px;color:#3e6b4e;font-weight:700}
.ico{display:block}
@media(min-width:700px){
  body{background:#e7e0d4}
  .shell{min-height:100vh;box-shadow:0 0 0 1px rgba(255,255,255,.4)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* PERESMOTR editorial visual system */
:root{
 --bg:#f5f1e9;--bg-2:#ece6dc;--card:#fbf9f4;--ink:#202a29;
 --muted:#858b83;--soft:#59645e;--line:#e1dbd0;
 --pine:#263b36;--pine-2:#1f302c;--cream:#f5f1e8;--sage:#d1dbd0;
 --shadow:0 12px 32px rgba(37,48,43,.055);--radius:24px;
 --font:"Onest",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body{background:var(--bg);font-size:16px}
.shell{width:min(100%,520px);background:linear-gradient(180deg,#f7f4ed 0%,#f1ede5 100%)}
main{padding:12px 22px 34px}
h1,.h1{font-size:34px;letter-spacing:-1.1px;line-height:1.08;font-weight:700}
h2{font-size:21px;letter-spacing:-.45px;font-weight:650}
.lead{font-size:16px;line-height:1.55;color:#727b73}
.card{background:rgba(255,253,248,.9);border:1px solid rgba(219,213,202,.8);border-radius:24px;box-shadow:var(--shadow);padding:20px}
.page-head{margin:12px 0 20px}
.section-label{font-size:20px;margin:26px 2px 12px}
.btn{min-height:54px;border-radius:17px;font-size:15px;padding:14px 20px;font-weight:650}
.btn.primary{background:linear-gradient(135deg,#405650,#263b36);box-shadow:0 9px 22px rgba(38,59,54,.13)}
.btn.soft{background:#eae6dd;color:var(--pine);box-shadow:none}
.topbar{min-height:64px;padding:10px 18px 0}
.brand-mini{font-size:12px;letter-spacing:.28em;font-weight:600}
.brand-mini .logo-mark{width:30px}
.avatar,.round{width:42px;height:42px;border:1px solid #e2dcd1;box-shadow:0 4px 14px rgba(35,45,39,.05)}
.tabbar{width:min(100%,520px);background:rgba(247,244,237,.94);border-top:1px solid #e3ddd2;padding:9px 8px calc(9px + env(safe-area-inset-bottom))}
.tabbar button{font-size:10px;gap:4px;color:#6d716b}
.tabbar button.active{color:var(--pine)}
.tabbar .ico{width:23px;height:23px}
.welcome{background:linear-gradient(180deg,#f5f1e9 0%,#e8e5dc 100%);padding:18px 26px calc(22px + env(safe-area-inset-bottom))}
.welcome-mid{padding-top:4vh}
.welcome-logo{width:min(194px,54vw)}
.wordmark{font-size:24px;letter-spacing:.38em;color:#202a29}
.slogan{font-size:11px;letter-spacing:.34em;color:#69736d}
.welcome-copy{font-size:16px;color:#68736c;line-height:1.55}
.mountains{height:62%;opacity:.9}
.welcome-actions{padding:20px 4px 8px}
.consent .h1{font-size:30px}
.info-card{padding:16px;border-radius:20px}
.info-ico{background:#eeece3;color:var(--pine)}
.info-card b{font-size:15px}
.info-card p{font-size:13px;color:#778078}
.consent-actions .fine{font-size:12px}
.home-intro{padding:20px;border-radius:28px;background:radial-gradient(ellipse at 100% 0%,rgba(206,215,202,.55),transparent 58%),linear-gradient(135deg,#fdfbf6,#edece3);border:1px solid #e3ddd2;box-shadow:var(--shadow)}
.eyebrow{font-size:10px;letter-spacing:.19em;color:#6f766f;font-weight:700;display:block}
.greet{font-size:30px;margin:8px 0 0}
.home-intro .lead{margin:9px 0 18px;max-width:390px}
.home-intro .cta{width:100%;min-height:56px}
.home-today,.home-themes,.home-path,.home-insights{margin-top:24px}

async function initCloud(){

 if(!CLOUD_SYNC_ENABLED||!API_BASE){cloudStatus="paused";render();return;}
 if(!tg){cloudStatus="not_telegram";render();return;}
 if(!tg.initData){cloudStatus="telegram_data_missing";render();return;}
 cloudInitInFlight=true;
 cloudStatus="connecting";
 try{
  var consentResponse=await fetch(API_BASE+"/v1/consents",{method:"GET",headers:apiHeaders(),cache:"no-store"});
  if(!consentResponse.ok)throw await cloudHttpError(consentResponse,"Не удалось получить настройки согласий");
  var consentData=await consentResponse.json();
  consentSettings=consentData.consents||{ai_processing:false,ai_history_storage:false};consentLoaded=true;
  if(!consentSettings.updated_at){
   clearCloudRetry();cloudReady=false;cloudStatus="consent_required";
   if(entered()&&page!=="welcome"&&page!=="consent")page="consent";
   render();return;
  }
  registerAdminProfile();
  var r=await fetch(API_BASE+"/v1/state",{method:"GET",headers:apiHeaders(),cache:"no-store"});
  if(!r.ok)throw await cloudHttpError(r,"Не удалось загрузить состояние");
  var result=await r.json();
  if(result.found&&result.state)state=mergeStates(result.state,state);
  markEntered();
  progressPeriod=normalizeProgressPeriod(state.progressPeriod!=null?state.progressPeriod:progressPeriod);
  if(page==="welcome"||page==="consent"||page==="privacy"||page==="onboarding")page="home";
  saveLocalOnly();cloudReady=true;cloudStatus="connected";cloudErrorText="";
  clearCloudRetry();
  await cloudSaveNow(false);
  await refreshPremium();
  render();
 }catch(e){
  cloudReady=false;cloudStatus="error";cloudErrorText=e&&e.message?e.message:"Ошибка соединения";
  render();
  var toastText="Облако недоступно ("+cloudErrorText+"). Записи пока только на устройстве.";
  if(!cloudErrorShown||cloudLastToast!==toastText){cloudErrorShown=true;cloudLastToast=toastText;toast(toastText);}
  if(cloudRetryable(e))scheduleCloudRetry();
 }finally{cloudInitInFlight=false;}
}

 });
